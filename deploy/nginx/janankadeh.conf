log_format janankadeh '$remote_addr - $remote_user [$time_local] '
    '"$request_method $uri $server_protocol" $status $body_bytes_sent '
    '"$http_user_agent"';

server {
    listen 80;
    listen [::]:80;
    server_name janankadeh.ir;
    server_tokens off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 308 https://janankadeh.ir$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name janankadeh.ir;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/janankadeh.ir/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/janankadeh.ir/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_timeout 1d;
    ssl_session_cache shared:JanankadehTLS:10m;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=31536000" always;

    access_log /var/log/nginx/janankadeh.access.log janankadeh;

    client_max_body_size 3m;

    # Docker checks readiness directly inside the app container. Do not expose
    # database/Redis availability to public callers through the site proxy.
    location = /api/health/ready {
        access_log off;
        return 404;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host janankadeh.ir;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header Strict-Transport-Security;
        proxy_buffering off;
        proxy_read_timeout 120s;
    }
}
