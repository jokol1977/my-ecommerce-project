# Deny the retired auth-staging hostname until its external DNS record is removed.
server {
    listen 80;
    listen [::]:80;
    server_name auth-staging.janankadeh.ir;
    server_tokens off;
    return 410;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name auth-staging.janankadeh.ir;
    server_tokens off;
    ssl_reject_handshake on;
}
